kind: Environment
name: 'Sylius Standard Edition 1.12'
type: primary
environmentVariables:
  MYSQL_DATABASE: sylius
  MYSQL_PASSWORD: nopassword
  MYSQL_ROOT_PASSWORD: nopassword
  MYSQL_USER: sylius
components:
  -
    kind: Application
    name: php
    gitRepo: 'https://github.com/alexo-bunnyshell/templates.git'
    gitBranch: 'sylius-prod-1.12/v0.1.0'
    gitApplicationPath: components/sylius-standard-edition-1.12
    dockerCompose:
      build:
        context: ./components/sylius-standard-edition-1.12
        target: sylius_php_prod
      environment:
        APP_DEBUG: '0'
        APP_ENV: prod
        APP_SECRET: EDITME
        DATABASE_URL: 'mysql://{{ env.vars.MYSQL_USER }}:{{ env.vars.MYSQL_PASSWORD }}@mysql/{{ env.vars.MYSQL_DATABASE }}?serverVersion=8.4'
        MAILER_DSN: 'smtp://mailpit:1025'
        PHP_DATE_TIMEZONE: UTC
      ports:
        - '9000:9000'
        - '80:80'
    pod:
      init_containers:
        -
          from: init-migrations
          name: init-migrations
          shared_paths:
            -
              path: /srv/sylius
              target:
                path: /srv/sylius
                container: '@parent'
              initial_contents: '@target'
      sidecar_containers:
        -
          from: nginx
          name: nginx
          shared_paths:
            -
              path: /srv/sylius/public
              target:
                path: /srv/sylius/public
                container: '@parent'
              initial_contents: '@target'
    hosts:
      -
        hostname: 'store-{{ env.base_domain }}'
        path: /
        servicePort: 80
    volumes:
      -
        name: public-media
        mount: /srv/sylius/public/media
        subPath: ''
  -
    kind: SidecarContainer
    name: nginx
    gitRepo: 'https://github.com/alexo-bunnyshell/templates.git'
    gitBranch: 'sylius-prod-1.12/v0.1.0'
    gitApplicationPath: components/sylius-standard-edition-1.12
    dockerCompose:
      build:
        context: ./components/sylius-standard-edition-1.12
        target: sylius_nginx_bunnyshell
      environment:
        FPM_HOST: localhost
      ports:
        - '80:80'
    volumes:
      -
        name: public-media
        mount: /srv/sylius/public/media
        subPath: ''
  -
    kind: InitContainer
    name: init-migrations
    gitRepo: 'https://github.com/alexo-bunnyshell/templates.git'
    gitBranch: 'sylius-prod-1.12/v0.1.0'
    gitApplicationPath: components/sylius-standard-edition-1.12
    dockerCompose:
      build:
        context: ./components/sylius-standard-edition-1.12
        target: sylius_migrations_prod
      environment:
        APP_DEBUG: '0'
        APP_ENV: prod
        APP_SECRET: EDITME
        BASE_DOMAIN: '{{ components.php.ingress.hosts[0].hostname }}'
        DATABASE_URL: 'mysql://{{ env.vars.MYSQL_USER }}:{{ env.vars.MYSQL_PASSWORD }}@mysql/{{ env.vars.MYSQL_DATABASE }}?serverVersion=8.4'
        LOAD_FIXTURES: '1'
        PHP_DATE_TIMEZONE: UTC
    volumes:
      -
        name: public-media
        mount: /srv/sylius/public/media
        subPath: ''
  -
    kind: Database
    name: mysql
    dockerCompose:
      cap_add:
        - SYS_NICE
      command: '--mysql-native-password=ON --log_bin_trust_function_creators=1'
      image: 'mysql:8.4'
      ports:
        - '3306:3306'
    volumes:
      -
        name: mysql-data
        mount: /var/lib/mysql
        subPath: ''
  -
    kind: Service
    name: mailpit
    dockerCompose:
      image: 'axllent/mailpit:latest'
      ports:
        - '8025:8025'
        - '1025:1025'
    hosts:
      -
        hostname: 'mailpit-{{ env.base_domain }}'
        path: /
        servicePort: 8025
volumes:
  -
    name: mysql-data
    size: 1Gi
    type: disk
  -
    name: public-media
    size: 1Gi
    type: network
