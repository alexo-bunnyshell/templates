kind: Environment
name: Showcase - Template Variables
type: primary
templateVariables:
    verbose: false
    version: '1.27.3'
    host: 'localhost'
    port: 80
    fib: 1
components:
    -
        kind: Application
        name: web
        dockerCompose:
            image: 'nginx:{{ template.vars.version }}'
            environment:
                NGINX_ENTRYPOINT_QUIET_LOGS: '{{ template.vars.verbose ? 0 : 1 }}'
                NGINX_HOST: '{{ template.vars.host }}'
                NGINX_PORT: '{{ template.vars.port }}'
                FIB_SEQ: '{{ template.vars.fib }}'
            ports:
                - '80:80'
        hosts:
            -
                hostname: 'web-{{ env.base_domain }}'
                path: /
                servicePort: 80
