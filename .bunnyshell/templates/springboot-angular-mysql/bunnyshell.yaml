kind: Environment
name: Spring Boot / Angular / MySQL boilerplate
type: primary
environmentVariables:
    MYSQL_DATABASE: bunny_books
    MYSQL_USER: books
    MYSQL_PASSWORD: need-to-replace
    MYSQL_ROOT_PASSWORD: need-to-replace
components:
    -
        kind: Database
        name: db
        dockerCompose:
            command: '--mysql-native-password=ON'
            environment:
                MYSQL_DATABASE: '{{ env.vars.MYSQL_DATABASE }}'
                MYSQL_PASSWORD: '{{ env.vars.MYSQL_PASSWORD }}'
                MYSQL_ROOT_PASSWORD: '{{ env.vars.MYSQL_ROOT_PASSWORD }}'
                MYSQL_USER: '{{ env.vars.MYSQL_USER }}'
            image: 'mysql:8.4'
            ports:
                - '3306:3306'
        volumes:
            -
                name: db-data
                mount: /var/lib/mysql
                subPath: ''
    -
        kind: Application
        name: api
        gitRepo: 'https://github.com/alexo-bunnyshell/templates.git'
        gitBranch: update-templates-2025
        gitApplicationPath: components/springboot-rest-api
        dockerCompose:
            build:
                context: ./components/springboot-rest-api
                dockerfile: .docker/Dockerfile
                target: dev
            environment:
                DATABASE_DBNAME: '{{ env.vars.MYSQL_DATABASE }}'
                DATABASE_HOST: db
                DATABASE_PASSWORD: '{{ env.vars.MYSQL_PASSWORD }}'
                DATABASE_PORT: '3306'
                DATABASE_USER: '{{ env.vars.MYSQL_USER }}'
                FRONTEND_URL: 'https://{{ components.frontend.ingress.hosts[0].hostname }}'
            ports:
                - '9000:9000'
        hosts:
            -
                hostname: 'api-{{ env.base_domain }}'
                path: /
                servicePort: 9000
    -
        kind: Application
        name: frontend
        gitRepo: 'https://github.com/alexo-bunnyshell/templates.git'
        gitBranch: update-templates-2025
        gitApplicationPath: components/angular-books-app
        dockerCompose:
            build:
                context: ./components/angular-books-app
                dockerfile: .docker/Dockerfile
                target: dev
            deploy:
                resources:
                    limits:
                        memory: 1G
                    reservations:
                        memory: 1G
            environment:
                API_URL: 'https://{{ components.api.ingress.hosts[0].hostname }}'
            labels:
                kompose.service.healthcheck.readiness.test: 'CMD sh -c "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080 || exit 1"'
                kompose.service.healthcheck.readiness.interval: 15s
                kompose.service.healthcheck.readiness.timeout: 10s
                kompose.service.healthcheck.readiness.retries: 10
                kompose.service.healthcheck.readiness.start_period: 120s
            ports:
                - '8080:8080'
        hosts:
            -
                hostname: 'app-{{ env.base_domain }}'
                path: /
                servicePort: 8080
volumes:
    -
        name: db-data
        size: 1Gi
        type: disk
dev:
    api:
        -
            containers:
                api:
                    remoteDevProfile: api
    frontend:
        -
            containers:
                frontend:
                    remoteDevProfile: frontend
